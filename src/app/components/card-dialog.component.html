@if (draft(); as d) {
  <div class="backdrop" (mousedown)="close()">
    <div class="dialog" role="dialog" aria-modal="true" aria-label="Edit card" (mousedown)="$event.stopPropagation()">
      <header class="dialog-head">
        <input class="dialog-title" [ngModel]="d.title" (ngModelChange)="patch({ title: $event })" maxlength="200"
               placeholder="Card title" aria-label="Title" />
        <button class="icon-btn" type="button" aria-label="Close" (click)="close()"><app-icon name="x" /></button>
      </header>

      <div class="dialog-body">
        <div class="dialog-main">
          <label class="field">
            <span class="field-label"><app-icon name="text" [size]="14" /> Description</span>
            <textarea rows="5" maxlength="5000" [ngModel]="d.description" (ngModelChange)="patch({ description: $event })"
                      placeholder="Add more detail…"></textarea>
          </label>

          <div class="field">
            <span class="field-label">
              <app-icon name="list" [size]="14" /> Checklist
              @if (d.checklist.length) { <em>{{ progress() }}%</em> }
            </span>
            @if (d.checklist.length) {
              <div class="progress big"><span [style.width.%]="progress()"></span></div>
            }
            <ul class="checklist">
              @for (item of d.checklist; track item.id) {
                <li [class.done]="item.done">
                  <button type="button" class="check" [class.on]="item.done" (click)="toggleItem(item.id)"
                          [attr.aria-label]="item.done ? 'Mark not done' : 'Mark done'">
                    @if (item.done) { <app-icon name="check" [size]="12" /> }
                  </button>
                  <input [ngModel]="item.text" (ngModelChange)="editItem(item.id, $event)" maxlength="200" />
                  <button type="button" class="icon-btn tiny danger" aria-label="Remove item" (click)="removeItem(item.id)">
                    <app-icon name="x" [size]="13" />
                  </button>
                </li>
              }
            </ul>
            <div class="inline-add">
              <input [(ngModel)]="itemInput" maxlength="200" placeholder="Add an item and press Enter"
                     (keydown.enter)="addItem(); $event.preventDefault()" />
            </div>
          </div>
        </div>

        <aside class="dialog-side">
          <div class="field">
            <span class="field-label">Status</span>
            <select [ngModel]="columnId()" (ngModelChange)="columnId.set($event)">
              @for (c of store.active().columns; track c.id) {
                <option [value]="c.id">{{ c.name }}</option>
              }
            </select>
          </div>

          <div class="field">
            <span class="field-label">Priority</span>
            <div class="segmented">
              @for (p of priorities; track p) {
                <button type="button" [attr.data-priority]="p" [class.on]="d.priority === p" (click)="patch({ priority: p })">
                  {{ p }}
                </button>
              }
            </div>
          </div>

          <label class="field">
            <span class="field-label">Due date</span>
            <div class="date-row">
              <input type="date" [ngModel]="d.due ?? ''" (ngModelChange)="patch({ due: $event || null })" />
              @if (d.due) {
                <button type="button" class="icon-btn tiny" aria-label="Clear date" (click)="patch({ due: null })">
                  <app-icon name="x" [size]="13" />
                </button>
              }
            </div>
          </label>

          <div class="field">
            <span class="field-label">Labels</span>
            <div class="labels">
              @for (l of d.labels; track l) {
                <button type="button" class="label removable" [style.--h]="hue(l)" (click)="removeLabel(l)" title="Remove">
                  {{ l }} <app-icon name="x" [size]="11" />
                </button>
              }
            </div>
            <input [(ngModel)]="labelInput" maxlength="24" placeholder="Add label…"
                   (keydown.enter)="addLabel(); $event.preventDefault()" (blur)="addLabel()" />
          </div>
        </aside>
      </div>

      <footer class="dialog-foot">
        <button class="btn danger-ghost" type="button" (click)="remove()"><app-icon name="trash" /> Delete</button>
        <span class="spacer"></span>
        <span class="hint">Ctrl/⌘ + Enter to save</span>
        <button class="btn ghost" type="button" (click)="close()">Cancel</button>
        <button class="btn primary" type="button" (click)="save()">Save changes</button>
      </footer>
    </div>
  </div>
}
